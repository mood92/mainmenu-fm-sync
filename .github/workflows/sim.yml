name: simulator
on:
  push:
    branches: [group-sync]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Python deps
        run: pip install Pillow
      - name: Build the simulator (firmware compiled to WebAssembly)
        id: sim
        continue-on-error: true
        run: |
          git tag -f drum-v1.0.1 44c9ad4 || true
          mkdir -p /tmp/shim && ln -sf "$(which clang)" /tmp/shim/cc
          export PATH=/tmp/shim:$PATH CPATH=$PWD/tests/linux_stub
          set -o pipefail
          tools/build_sim.sh 2>&1 | tee /tmp/sim-log.txt | tail -60
      - name: Publish to the sim branch
        if: steps.sim.outcome == 'success'
        run: |
          du -sh build/sim; ls build/sim | head -40
          rm -rf /tmp/sp && mkdir /tmp/sp && cp -r build/sim/. /tmp/sp/ && rm -rf /tmp/sp/emcache /tmp/sp/src /tmp/sp/host /tmp/sp/gen
          cd /tmp/sp && git init -q && git config user.name build && git config user.email build@users.noreply.github.com
          git checkout -q --orphan sim && git add -A && git commit -q -m "simulator ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sim
      - uses: actions/upload-artifact@v4
        if: steps.sim.outcome == 'success'
        with: {name: Hortator-simulator, path: build/sim}
      - name: Log to build-logs
        if: always()
        continue-on-error: true
        run: |
          rm -rf /tmp/bl && mkdir /tmp/bl && cd /tmp/bl && git init -q && git config user.name build && git config user.email build@users.noreply.github.com
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin build-logs && git checkout -q -b build-logs FETCH_HEAD
          { echo "commit: $GITHUB_SHA"; echo "outcome: ${{ steps.sim.outcome }}"; tail -150 /tmp/sim-log.txt; } > sim-latest.txt
          git add -A && git commit -q -m "sim log ${GITHUB_SHA::7}" && git push -q origin build-logs
